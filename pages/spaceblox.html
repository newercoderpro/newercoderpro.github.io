<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpaceBlox Scalable</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Prevents scrollbars in iframe */
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; /* Disables double-tap zoom */
        }

        /* This container holds the entire game world */
        #game-scaler {
            width: 850px;  /* Base width we design for */
            height: 450px; /* Base height we design for */
            position: relative;
            transform-origin: center center; /* Scale from center */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #333;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #top-ui {
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 20px;
        }

        #main-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Canvas styling */
        canvas {
            background-color: #000;
            border: 3px solid #666;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            /* Resolution is 500x300, handled in JS */
        }

        /* Control Clusters */
        .control-cluster {
            display: flex;
            gap: 10px;
        }

        .touch-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid #999;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, background 0.1s;
        }

        .touch-btn:active, .touch-btn.active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
            border-color: white;
        }

        .fire-btn {
            background: rgba(255, 50, 50, 0.2);
            border-color: #ff5555;
            height: 170px; /* Tall fire button for easy hitting */
            border-radius: 20px;
        }

        #bottom-settings {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #aaa;
        }

        input[type="number"] {
            width: 50px;
            padding: 5px;
            font-size: 16px;
            background: #111;
            border: 1px solid #555;
            color: white;
            text-align: center;
        }

        /* Menus (Pause / Game Over) */
        .overlay-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 2px solid #4CAF50;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            min-width: 300px;
        }

        .hidden { display: none !important; }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #pause-btn {
            background: #555;
            border: none;
            color: white;
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div id="game-scaler">
        
        <div id="top-ui">
            <div>Score: <b id="score" style="color:#4CAF50">0</b></div>
            <button id="pause-btn">PAUSE (Esc)</button>
        </div>

        <div id="main-row">
            <div class="control-cluster">
                <div id="btn-left" class="touch-btn">◀</div>
                <div id="btn-right" class="touch-btn">▶</div>
            </div>

            <canvas id="gameCanvas"></canvas>

            <div class="control-cluster">
                <div id="btn-fire" class="touch-btn fire-btn">FIRE</div>
            </div>
        </div>

        <div id="bottom-settings">
            <label>Player Spd: <input type="number" id="playerSpeed" value="10"></label>
            <label>Enemy Spd: <input type="number" id="enemySpeed" value="10"></label>
        </div>

        <div id="pause-menu" class="overlay-menu hidden">
            <h1 style="margin-top:0">PAUSED</h1>
            <button id="resume-btn" class="menu-btn">RESUME</button>
            <button id="restartBtn" class="menu-btn" style="background:#666">RESTART</button>
        </div>

        <div id="game-over-screen" class="overlay-menu hidden">
            <h1 style="color:#ff5555; margin-top:0">GAME OVER</h1>
            <p style="font-size: 24px">Score: <span id="final-score">0</span></p>
            <button id="restartBtnGameOver" class="menu-btn">PLAY AGAIN</button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Internal Resolution (High Quality)
        canvas.width = 500;
        canvas.height = 300;

        // Elements
        const scaler = document.getElementById('game-scaler');
        const playerInput = document.getElementById('playerSpeed');
        const enemyInput = document.getElementById('enemySpeed');
        const scoreDisplay = document.getElementById('score');
        const finalScoreDisplay = document.getElementById('final-score');
        
        // State
        let isPaused = false;
        let isGameOver = false;
        let score = 0;
        let animationFrameId;

        // Modifiers (10 input = old speed values)
        const P_MOD = 0.5;
        const E_MOD = 0.2;

        let player = { x: 230, y: 250, w: 40, h: 40, speed: 5, isShooting: false };
        let bullets = [];
        let enemies = [];
        const keys = {};
        const touchState = { left: false, right: false };

        // --- SCALING LOGIC (The "Google Sites" Fix) ---
        function resizeGame() {
            // We want to fit the 850x450 container into the window
            const targetWidth = 850;
            const targetHeight = 450;
            const windowW = window.innerWidth;
            const windowH = window.innerHeight;

            // Calculate scale based on the smallest dimension to ensure fit
            const scaleX = windowW / targetWidth;
            const scaleY = windowH / targetHeight;
            const scale = Math.min(scaleX, scaleY) * 0.95; // 0.95 for small padding

            scaler.style.transform = `scale(${scale})`;
        }
        
        // Listen for window resize
        window.addEventListener('resize', resizeGame);
        resizeGame(); // Initial trigger

        // --- INPUT HANDLERS ---
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === 'Escape') togglePause();
        });
        window.addEventListener('keyup', e => {
            keys[e.key] = false;
            // Reset shooting flag on key up
            if (!keys[' '] && !keys['ArrowUp'] && !keys['w']) player.isShooting = false;
        });

        // Universal Touch/Mouse Handler
        function setupBtn(id, stateKey, isAction) {
            const btn = document.getElementById(id);
            const activate = (e) => {
                e.preventDefault();
                btn.classList.add('active');
                if (isAction) {
                    shoot(); // Fire immediately on tap
                } else {
                    touchState[stateKey] = true;
                }
            };
            const deactivate = (e) => {
                e.preventDefault();
                btn.classList.remove('active');
                if (!isAction) touchState[stateKey] = false;
            };

            ['mousedown', 'touchstart'].forEach(evt => btn.addEventListener(evt, activate));
            ['mouseup', 'mouseleave', 'touchend'].forEach(evt => btn.addEventListener(evt, deactivate));
        }

        setupBtn('btn-left', 'left', false);
        setupBtn('btn-right', 'right', false);
        setupBtn('btn-fire', null, true);

        document.getElementById('pause-btn').onclick = togglePause;
        document.getElementById('resume-btn').onclick = togglePause;

        // --- GAME LOGIC ---
        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            document.getElementById('pause-menu').classList.toggle('hidden', !isPaused);
            if (!isPaused) gameLoop();
            else cancelAnimationFrame(animationFrameId);
        }

        function updateSpeeds() {
            player.speed = (parseInt(playerInput.value) || 1) * P_MOD;
        }

        function shoot() {
            if (isPaused || isGameOver) return;
            bullets.push({ x: player.x + player.w/2 - 2, y: player.y, w: 5, h: 12, s: 7 });
        }

        function update() {
            if (isPaused || isGameOver) return;

            // Movement
            const moveLeft = keys['ArrowLeft'] || keys['a'] || touchState.left;
            const moveRight = keys['ArrowRight'] || keys['d'] || touchState.right;
            const shootingKey = keys[' '] || keys['ArrowUp'] || keys['w'];

            if (moveLeft && player.x > 0) player.x -= player.speed;
            if (moveRight && player.x < canvas.width - player.w) player.x += player.speed;

            // Continuous Shooting check
            if (shootingKey && !player.isShooting) {
                shoot();
                player.isShooting = true;
            }

            // Projectiles
            bullets.forEach((b, i) => {
                b.y -= b.s;
                if (b.y < -20) bullets.splice(i, 1);
            });

            // Enemies
            enemies.forEach((e, i) => {
                e.y += e.s;
                if (e.y > canvas.height) enemies.splice(i, 1);
                
                // Player Collision
                if (rectIntersect(player, e)) gameOver();
            });

            // Bullet Collision
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (rectIntersect(bullets[i], enemies[j])) {
                        bullets.splice(i, 1);
                        enemies.splice(j, 1);
                        score += 10;
                        scoreDisplay.textContent = score;
                        break;
                    }
                }
            }

            // Spawn
            if (Math.random() < 0.02) {
                enemies.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30, w: 30, h: 30,
                    s: (parseInt(enemyInput.value) || 1) * E_MOD
                });
            }
        }

        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || 
                     r2.x + r2.w < r1.x || 
                     r2.y > r1.y + r1.h || 
                     r2.y + r2.h < r1.y);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ff00ff'; // Player
            ctx.fillRect(player.x, player.y, player.w, player.h);
            
            ctx.fillStyle = '#ffff00'; // Bullets
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
            
            ctx.fillStyle = '#ff3333'; // Enemies
            enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));
        }

        function gameLoop() {
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameOver = true;
            finalScoreDisplay.textContent = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
            cancelAnimationFrame(animationFrameId);
        }

        function restart() {
            isPaused = false; isGameOver = false; score = 0;
            scoreDisplay.textContent = 0;
            player.x = canvas.width / 2 - 20;
            bullets = []; enemies = [];
            document.querySelectorAll('.overlay-menu').forEach(el => el.classList.add('hidden'));
            updateSpeeds();
            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        document.getElementById('restartBtn').onclick = restart;
        document.getElementById('restartBtnGameOver').onclick = restart;
        playerInput.onchange = updateSpeeds;

        // Start
        updateSpeeds();
        gameLoop();
    </script>
</body>
</html>
