<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceBlox</title>
    <style>
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #333;
    color: white;
    font-family: Arial, sans-serif;
}
#navlink {
    display: block;

    
    position: absolute; 
    top: 0;
    left: 0;
    width: 100%; 
    text-align: center; 

    
    background-color: #d3d3d3; 
    padding: 10px 0; 

    
    color: #333;
    text-decoration: none;
    font-size: 16px;
    z-index: 10; 
}
#game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#gameCanvas {
    background-color: #000;
    border: 2px solid white;
}

#ui-container {
    margin-top: 20px;
    display: flex;
    gap: 20px;
    align-items: center;
}

#score-display {
    font-size: 24px;
}

.control-group {
    display: flex;
    align-items: center;
    gap: 5px;
}

input[type="number"] {
    width: 60px;
    padding: 5px;
}

button {
    padding: 10px 20px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
}

#pause-menu, #game-over-screen {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.8);
    padding: 40px;
    text-align: center;
    border-radius: 10px;
}

.hidden {
    display: none;
}

#game-over-screen h1 {
    color: red;
}

    </style>
</head>
<body>
    <h1>SpaceBlox</h1>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-container">
            <div id="score-display">Score: <span id="score">0</span></div>
            <div class="control-group">
                <label for="playerSpeed">Player Speed:</label>
                <input type="number" id="playerSpeed" value="5" min="1" step="1">
            </div>
            <div class="control-group">
                <label for="enemySpeed">Enemy Speed:</label>
                <input type="number" id="enemySpeed" value="2" min="1" step="1">
            </div>
            <button id="restartBtn">Restart Game</button>
        </div>
    </div>
    <div id="pause-menu" class="hidden">
        <h1>Game Paused</h1>
        <p>Press **Esc** to resume</p>
    </div>
    <div id="game-over-screen" class="hidden">
        <h1>Game Over</h1>
        <p>Your final score was: <span id="final-score">0</span></p>
        <button id="restartBtnGameOver">Restart Game</button>
    </div>
    <script>
    const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 500;
canvas.height = 300;

const playerSpeedInput = document.getElementById('playerSpeed');
const enemySpeedInput = document.getElementById('enemySpeed');
const restartBtn = document.getElementById('restartBtn');
const restartBtnGameOver = document.getElementById('restartBtnGameOver');
const scoreDisplay = document.getElementById('score');
const finalScoreDisplay = document.getElementById('final-score');
const pauseMenu = document.getElementById('pause-menu');
const gameOverScreen = document.getElementById('game-over-screen');

let isPaused = false;
let isGameOver = false;
let score = 0;
let animationFrameId;

let player = {
    x: canvas.width / 2 - 25,
    y: canvas.height - 60,
    width: 50,
    height: 50,
    speed: 5
};

let bullets = [];
let enemies = [];

const keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === 'Escape') {
        togglePause();
    }
});
window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

function togglePause() {
    if (isGameOver) return;
    isPaused = !isPaused;
    if (isPaused) {
        pauseMenu.classList.remove('hidden');
        cancelAnimationFrame(animationFrameId);
    } else {
        pauseMenu.classList.add('hidden');
        gameLoop();
    }
}

function updateSpeeds() {
    player.speed = parseInt(playerSpeedInput.value);
}

playerSpeedInput.addEventListener('change', updateSpeeds);
enemySpeedInput.addEventListener('change', updateSpeeds);

function createEnemy() {
    return {
        x: Math.random() * (canvas.width - 40),
        y: -40,
        width: 40,
        height: 40,
        speed: parseInt(enemySpeedInput.value)
    };
}

function spawnEnemies() {
    if (!isPaused && !isGameOver) {
        if (Math.random() < 0.02) {
            enemies.push(createEnemy());
        }
    }
}

function shoot() {
    bullets.push({
        x: player.x + player.width / 2 - 2.5,
        y: player.y,
        width: 5,
        height: 10,
        speed: 7
    });
}

function update() {
    if (isPaused || isGameOver) return;

    // Player movement
    if ((keys['ArrowLeft'] || keys['a']) && player.x > 0) {
        player.x -= player.speed;
    }
    if ((keys['ArrowRight'] || keys['d']) && player.x < canvas.width - player.width) {
        player.x += player.speed;
    }

    //Shooting 
    if (keys[' '] && !player.isShooting || keys['ArrowUp'] && !player.isShooting || keys['w'] && !player.isShooting) { shoot(); player.isShooting = true; } // Reset isShooting flag if neither key is pressed 
    if (!keys[' '] && !keys['ArrowUp'] && !keys['w']) { player.isShooting = false; }
    // Update bullets
    bullets.forEach((bullet, index) => {
        bullet.y -= bullet.speed;
        if (bullet.y < 0) {
            bullets.splice(index, 1);
        }
    });

    // Update enemies
    enemies.forEach((enemy, index) => {
        enemy.y += enemy.speed;
        if (enemy.y > canvas.height) {
            enemies.splice(index, 1);
        }
    });

    // Check for collisions
    bullets.forEach((bullet, bIndex) => {
        enemies.forEach((enemy, eIndex) => {
            if (
                bullet.x < enemy.x + enemy.width &&
                bullet.x + bullet.width > enemy.x &&
                bullet.y < enemy.y + enemy.height &&
                bullet.y + bullet.height > enemy.y
            ) {
                bullets.splice(bIndex, 1);
                enemies.splice(eIndex, 1);
                score += 10;
                scoreDisplay.textContent = score;
            }
        });
    });

    // Check for game over
    enemies.forEach((enemy) => {
        if (
            player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y
        ) {
            gameOver();
        }
    });

    spawnEnemies();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw player
    ctx.fillStyle = 'magenta';
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Draw bullets
    ctx.fillStyle = 'yellow';
    bullets.forEach(bullet => {
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
    });

    // Draw enemies
    ctx.fillStyle = 'red';
    enemies.forEach(enemy => {
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
    });
}

function gameLoop() {
    update();
    draw();
    animationFrameId = requestAnimationFrame(gameLoop);
}

function gameOver() {
    isGameOver = true;
    finalScoreDisplay.textContent = score;
    gameOverScreen.classList.remove('hidden');
    cancelAnimationFrame(animationFrameId);
}

function restartGame() {
    isPaused = false;
    isGameOver = false;
    score = 0;
    scoreDisplay.textContent = 0;
    player.x = canvas.width / 2 - 25;
    player.y = canvas.height - 60;
    bullets = [];
    enemies = [];
    gameOverScreen.classList.add('hidden');
    pauseMenu.classList.add('hidden');
    
    // Clear any previous animation frame and start a new game loop
    cancelAnimationFrame(animationFrameId);
    gameLoop();
}

restartBtn.addEventListener('click', restartGame);
restartBtnGameOver.addEventListener('click', restartGame);

// Initial game start
gameLoop();
<!-- Made by ET -->
    </script>
</body>
</html
