<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpaceBlox Mobile & Keyboard</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 10px;
        }

        #game-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        #gameCanvas {
            background-color: #000;
            border: 2px solid #555;
            width: 100%; 
            max-width: 500px; 
            height: auto;
            max-height: 50vh; 
            display: block;
        }

        .side-panel {
            display: flex;
            gap: 10px;
            padding: 10px;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #888;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            user-select: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.92);
        }

        .fire-btn {
            background: rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
        }

        #ui-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 10px;
        }

        #settings-bar {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            font-size: 12px;
        }

        input[type="number"] {
            width: 40px;
            background: #333;
            color: white;
            border: 1px solid #555;
        }

        #pause-menu, #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            border: 1px solid #4CAF50;
        }

        .hidden { display: none; }
        .menu-btn {
            padding: 10px 20px;
            margin: 5px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="main-wrapper">
        <div id="ui-bar">
            <div>Score: <b id="score">0</b></div>
            <button class="menu-btn" id="pause-btn" style="background:#444">Pause</button>
        </div>

        <div id="game-row">
            <div class="side-panel">
                <div id="btn-left" class="touch-btn">◀</div>
                <div id="btn-right" class="touch-btn">▶</div>
            </div>

            <canvas id="gameCanvas"></canvas>

            <div class="side-panel">
                <div id="btn-fire" class="touch-btn fire-btn">FIRE</div>
            </div>
        </div>

        <div id="settings-bar">
            <span>P-Speed: <input type="number" id="playerSpeed" value="10"></span>
            <span>E-Speed: <input type="number" id="enemySpeed" value="10"></span>
        </div>
    </div>

    <div id="pause-menu" class="hidden">
        <h2>PAUSED</h2>
        <button id="resume-btn" class="menu-btn">RESUME</button>
        <button id="restartBtn" class="menu-btn" style="background:#666">RESTART</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h2 style="color:#ff4444">GAME OVER</h2>
        <p>Score: <span id="final-score">0</span></p>
        <button id="restartBtnGameOver" class="menu-btn">PLAY AGAIN</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 500;
        canvas.height = 300;

        const playerSpeedInput = document.getElementById('playerSpeed');
        const enemySpeedInput = document.getElementById('enemySpeed');
        const scoreDisplay = document.getElementById('score');
        const finalScoreDisplay = document.getElementById('final-score');
        
        let isPaused = false;
        let isGameOver = false;
        let score = 0;
        let animationFrameId;

        const P_MOD = 0.5;
        const E_MOD = 0.2;

        let player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 50,
            width: 40,
            height: 40,
            speed: 5,
            isShooting: false // Added flag to prevent holding key for rapid fire
        };

        let bullets = [];
        let enemies = [];
        const keys = {};
        const touchState = { left: false, right: false };

        // Keyboard Event Listeners
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === 'Escape') togglePause();
        });
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Touch Event Listeners
        function setupTouch(id, stateKey, isAction = false) {
            const btn = document.getElementById(id);
            const start = (e) => {
                e.preventDefault();
                if (isAction) shoot();
                else touchState[stateKey] = true;
            };
            const end = (e) => {
                e.preventDefault();
                if (!isAction) touchState[stateKey] = false;
            };
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        setupTouch('btn-left', 'left');
        setupTouch('btn-right', 'right');
        setupTouch('btn-fire', null, true);

        document.getElementById('pause-btn').onclick = togglePause;
        document.getElementById('resume-btn').onclick = togglePause;

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            document.getElementById('pause-menu').classList.toggle('hidden', !isPaused);
            if (!isPaused) gameLoop();
            else cancelAnimationFrame(animationFrameId);
        }

        function updateSpeeds() {
            player.speed = (parseInt(playerSpeedInput.value) || 1) * P_MOD;
        }

        function shoot() {
            if (isPaused || isGameOver) return;
            bullets.push({ 
                x: player.x + player.width/2 - 2, 
                y: player.y, 
                w: 4, 
                h: 10, 
                s: 7 
            });
        }

        function update() {
            if (isPaused || isGameOver) return;

            // Player Movement (Arrow Keys + WASD + Touch)
            if ((keys['ArrowLeft'] || keys['a'] || touchState.left) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || touchState.right) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Shooting Logic (Space, ArrowUp, W)
            // Checks if any shoot key is pressed AND we aren't already shooting
            if ((keys[' '] || keys['ArrowUp'] || keys['w']) && !player.isShooting) {
                shoot();
                player.isShooting = true;
            }

            // Reset shooting flag when keys are released
            if (!keys[' '] && !keys['ArrowUp'] && !keys['w']) {
                player.isShooting = false;
            }

            // Update Bullets
            bullets.forEach((b, i) => {
                b.y -= b.s;
                if (b.y < -10) bullets.splice(i, 1);
            });

            // Update Enemies
            enemies.forEach((e, i) => {
                e.y += e.s;
                if (e.y > canvas.height) enemies.splice(i, 1);
                
                // Collision: Enemy hits Player
                if (player.x < e.x + e.w && player.x + player.width > e.x &&
                    player.y < e.y + e.h && player.y + player.height > e.y) {
                    gameOver();
                }
            });

            // Collision: Bullet hits Enemy
            bullets.forEach((b, bi) => {
                enemies.forEach((e, ei) => {
                    if (b.x < e.x + e.w && b.x + b.w > e.x &&
                        b.y < e.y + e.h && b.y + b.h > e.y) {
                        bullets.splice(bi, 1);
                        enemies.splice(ei, 1);
                        score += 10;
                        scoreDisplay.textContent = score;
                    }
                });
            });

            // Spawn Enemies
            if (Math.random() < 0.02) {
                enemies.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30, 
                    w: 30, 
                    h: 30,
                    s: (parseInt(enemySpeedInput.value) || 1) * E_MOD
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Player
            ctx.fillStyle = '#ff00ff';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Draw Bullets
            ctx.fillStyle = '#ffff00';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
            
            // Draw Enemies
            ctx.fillStyle = '#ff3333';
            enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));
        }

        function gameLoop() {
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameOver = true;
            finalScoreDisplay.textContent = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
            cancelAnimationFrame(animationFrameId);
        }

        function restart() {
            isPaused = false; isGameOver = false; score = 0;
            scoreDisplay.textContent = 0;
            player.x = canvas.width / 2 - 20;
            bullets = []; enemies = [];
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('pause-menu').classList.add('hidden');
            updateSpeeds();
            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        // Attach Restart Handlers
        document.getElementById('restartBtn').onclick = restart;
        document.getElementById('restartBtnGameOver').onclick = restart;
        playerSpeedInput.onchange = updateSpeeds;

        // Start Game
        updateSpeeds();
        gameLoop();
    </script>
</body>
</html>
